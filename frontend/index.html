<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de productos</title>
  <!-- Estilos de la página -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Catálogo de productos tecnológicos</h1>

  <!-- FORMULARIO: sirve para crear y también para editar productos -->
  <section>
    <h2 id="form-title">Nuevo producto</h2>

    <form id="product-form">
      <label for="name">Nombre *</label>
      <input type="text" id="name" required>

      <label for="category">Categoría *</label>
      <select id="category" required>
        <option value="">-- Elige una categoría --</option>
        <option value="Portátiles">Portátiles</option>
        <option value="Móviles">Móviles</option>
        <option value="Periféricos">Periféricos</option>
        <option value="Audio">Audio</option>
        <option value="Otros">Otros</option>
      </select>

      <label for="price">Precio (€) *</label>
      <input type="number" id="price" min="0" step="0.01" required>

      <label for="description">Descripción</label>
      <textarea id="description" rows="3"></textarea>

      <button type="submit" id="submit-button">Guardar</button>
      <!-- Solo se mostrará al editar un producto -->
      <button type="button" id="cancel-button" hidden>Cancelar</button>
    </form>
  </section>

  <!-- LISTADO: app.js rellenará el <tbody> con una fila por producto -->
  <section>
    <h2>Productos</h2>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Descripción</th>
          <th>Fecha de creación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="product-list"></tbody>
    </table>
  </section>

  <!-- Lógica de la página -->
  <script src="app.js"></script>
</body>
</html>
